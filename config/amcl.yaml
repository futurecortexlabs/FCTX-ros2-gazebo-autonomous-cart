amcl:
  ros__parameters:
    alpha1: 0.4
    alpha2: 0.4
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: loop_cart/base_link
    global_frame_id: map
    initial_pose:
      x: 0.0
      y: 0.0
      yaw: 0.0
      z: 0.0
    laser_likelihood_max_dist: 2.0
    laser_max_range: 35.0
    laser_min_range: 0.06
    laser_model_type: likelihood_field
    max_beams: 90
    max_particles: 2000
    min_particles: 500
    odom_frame_id: wheel_odom
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    scan_topic: /loop/scan
    set_initial_pose: true
    sigma_hit: 0.15
    transform_tolerance: 0.5
    update_min_a: 0.03
    update_min_d: 0.03
    use_sim_time: true
    z_hit: 0.95
    z_rand: 0.05
