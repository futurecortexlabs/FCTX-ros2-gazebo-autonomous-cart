<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <!-- この設定ファイルの場所を基準にし、クローン先に依存しない。 -->
  <dir prefix="relative">.</dir>
  <alias><family>sans-serif</family><prefer><family>Meiryo</family><family>Noto Sans CJK JP</family></prefer></alias>
  <alias><family>sans</family><prefer><family>Meiryo</family><family>Noto Sans CJK JP</family></prefer></alias>
</fontconfig>
